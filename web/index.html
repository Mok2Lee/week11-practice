<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>미니 드라이브</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><p class="course">클라우드 컴퓨팅 / AWS Lambda</p><h1>미니 드라이브</h1></div>
      <button id="sign-out" type="button" hidden>로그아웃</button>
    </header>
    <p id="status" role="status" aria-live="polite">설정 확인 중</p>
    <section id="access" hidden>
      <form id="access-form">
        <label for="team-code">팀 실습 코드</label>
        <input id="team-code" type="password" required autocomplete="off">
        <button id="sign-in" type="submit">드라이브 열기</button>
      </form>
    </section>
    <div id="drive" hidden>
      <section aria-labelledby="upload-title">
        <h2 id="upload-title">파일 업로드</h2>
        <form id="upload-form">
          <label for="file">실습 파일 선택</label>
          <input id="file" type="file" required>
          <button id="upload" type="submit">업로드</button>
        </form>
      </section>
      <section aria-labelledby="files-title">
        <div class="bar"><h2 id="files-title">내 파일</h2><button id="refresh" type="button">목록 조회</button></div>
        <ul id="files" aria-label="파일 목록"></ul>
        <button id="next-page" type="button" hidden>더 보기</button>
      </section>
      <section aria-labelledby="rate-title">
        <div class="bar"><h2 id="rate-title">요청량 확인</h2><button id="burst" type="button">목록 요청 24건 보내기</button></div>
        <p>같은 목록 API 응답의 상태 코드를 비교합니다.</p>
        <output id="rate-result" aria-live="polite"></output>
      </section>
    </div>
  </main>
</body>
</html>
